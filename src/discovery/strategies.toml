all_files = ["package.json"]
any_json_paths = [
  { file = "package.json", path = "dependencies.next" },
  { file = "package.json", path = "devDependencies.next" },
]

[[strategy.capture]]
name = "package_manager"
kind = "lockfile_package_manager"

[[strategy.capture]]
name = "script"
kind = "json_first_existing_key"
file = "package.json"
paths = ["scripts.dev", "scripts.start"]

[strategy.service]
name = "app"
command = ["${package_manager}", "run", "${script}"]
working_dir = "."

